<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F7931A'/%3E%3Ctext x='32' y='46' font-family='system-ui,-apple-system,Segoe UI,sans-serif' font-size='46' font-weight='700' text-anchor='middle' fill='%23fff'%3E%E2%82%BF%3C/text%3E%3C/svg%3E">
    <title>GOLD ↔ ₿ TRACKER // TERMINAL_MODE</title>
    
    <!-- FONTS: JetBrains Mono for that hacker/developer feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- CHART.JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg-deep: #0d0d12;
            --bg-card: rgba(13, 13, 18, 0.85);
            --primary-mint: #00f5d4;
            --accent-lavender: #b589ff;
            --alert-red: #ff6b6b;
            --text-main: #e0f7fa;
            --grid-line: rgba(0, 245, 212, 0.08);
            --glow-strong: 0 0 15px rgba(0, 245, 212, 0.4);
            --glow-soft: 0 0 8px rgba(0, 245, 212, 0.2);
        }

        /* --- GLOBAL RESET & BODY --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* --- BACKGROUND GRID EFFECT --- */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
        }

        /* --- CONTAINER --- */
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            position: relative;
            z-index: 1;
        }

        /* --- HEADER --- */
        h1 { 
            text-align: center; 
            margin-bottom: 2rem; 
            color: var(--primary-mint);
            text-shadow: var(--glow-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .header-icon {
            width: 32px;
            height: 32px;
            fill: var(--primary-mint);
            filter: drop-shadow(0 0 5px var(--primary-mint));
        }

        /* --- LIVE BANNER --- */
        .btc-banner {
            background: linear-gradient(135deg, #0a0a0e 0%, #161620 100%);
            border: 1px solid var(--primary-mint);
            box-shadow: var(--glow-soft);
            color: var(--text-main);
            padding: 1.5rem;
            border-radius: 0; /* Sharp edges */
            margin-bottom: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Scanline animation */
        .btc-banner::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 245, 212, 0.15), transparent);
            animation: scanline 3s infinite linear;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .btc-banner h2 {
            font-size: 1rem;
            color: var(--accent-lavender);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.9;
        }

        .btc-price {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            color: var(--primary-mint);
            text-shadow: var(--glow-strong);
            margin-bottom: 0.5rem;
        }

        .btc-change { 
            font-size: 0.9rem; 
            color: #8899a6; 
            margin-top: 0.5rem; 
        }

        /* --- CARDS --- */
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 245, 212, 0.2);
            border-radius: 0;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(5px);
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* Top accent line */
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-mint), transparent);
        }

        h3 { 
            margin-bottom: 1rem; 
            color: var(--accent-lavender); 
            font-size: 1.1rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px dashed rgba(181, 137, 255, 0.3);
            padding-bottom: 0.5rem;
        }

        /* --- FORMS & INPUTS --- */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            font-weight: 500; 
            color: #8899a6;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        input[type="number"] {
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid rgba(0, 245, 212, 0.3);
            border-radius: 0;
            background: rgba(0, 0, 0, 0.4);
            color: var(--primary-mint);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-mint);
            box-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
            background: rgba(0, 245, 212, 0.05);
        }

        /* --- BUTTONS --- */
        button {
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid var(--primary-mint);
            border-radius: 0;
            background: rgba(0, 245, 212, 0.05);
            color: var(--primary-mint);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
        }

        button:hover:not(:disabled) {
            background: rgba(0, 245, 212, 0.15);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
            transform: translateY(-1px);
            border-color: var(--primary-mint);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
            color: #777;
        }

        button.secondary {
            border-color: var(--accent-lavender);
            color: var(--accent-lavender);
            background: rgba(181, 137, 255, 0.05);
        }

        button.secondary:hover:not(:disabled) {
            background: rgba(181, 137, 255, 0.15);
            box-shadow: 0 0 15px rgba(181, 137, 255, 0.3);
        }

        /* --- RESULTS & DATA --- */
        .results { margin-top: 1rem; }
        
        .result-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 0.6rem 0; 
            border-bottom: 1px dashed rgba(0, 245, 212, 0.2); 
            font-family: 'JetBrains Mono', monospace;
        }
        
        .result-item:last-child { border-bottom: none; }
        
        .label { 
            color: var(--accent-lavender); 
            font-size: 0.9rem; 
            text-transform: uppercase;
        }
        
        .value { 
            font-weight: 700; 
            color: var(--primary-mint); 
            font-size: 1rem;
            text-shadow: 0 0 4px rgba(0, 245, 212, 0.3);
        }

        /* --- LAYOUT UTILS --- */
        .split-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .chart-container { 
            position: relative; 
            height: 320px; 
            width: 100%; 
            margin-top: 0.5rem; 
        }

        .status-msg { 
            margin-top: 0.5rem; 
            font-size: 0.9rem; 
            font-family: 'JetBrains Mono', monospace;
            min-height: 1.2em;
        }
        .error { color: var(--alert-red); text-shadow: 0 0 5px rgba(255, 107, 107, 0.3); }
        .success { color: var(--primary-mint); text-shadow: 0 0 5px rgba(0, 245, 212, 0.3); }

        .controls { 
            display: flex; 
            gap: 0.5rem; 
            margin-top: 1rem; 
            align-items: center; 
            flex-wrap: wrap; 
        }
        
        .toggle-label { 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            font-size: 0.85rem; 
            color: #8899a6; 
            cursor: pointer; 
            user-select: none;
        }

        /* Custom Checkbox */
        input[type="checkbox"] {
            accent-color: var(--primary-mint);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--primary-mint);
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 8px var(--primary-mint);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .converter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .split-view { grid-template-columns: 1fr; }
            .btc-price { font-size: 2.2rem; }
            h1 { font-size: 1.4rem; }
            .header-icon { width: 24px; height: 24px; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <svg class="header-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.638 14.904c-1.602 6.43-8.113 10.34-14.542 8.736C2.67 22.05-1.244 15.525.362 9.105 1.962 2.67 8.475-1.24 14.9.358c6.43 1.605 10.342 8.115 8.738 14.548v-.002zm-4.184-5.756c.66-2.64-1.62-3.95-4.54-4.54l.94-3.76-2.29-.57-.92 3.7c-.6-.15-1.22-.29-1.84-.43l.92-3.7-2.29-.57-.94 3.76c-.5-.11-1.02-.23-1.52-.35l-.01-.05-3.16-.79-.61 2.45s1.7.39 1.67.42c.93.23 1.1.85 1.07 1.34l-1.07 4.3c.06.01.14.04.23.08-.07-.02-.15-.04-.23-.06l-1.5 6.02c-.11.28-.4.7-1.06.53.03.04-1.67-.42-1.67-.42l-1.13 2.64 2.98.74c.55.14 1.1.27 1.64.4l-.94 3.76 2.29.57.94-3.76c.62.17 1.23.32 1.83.46l-.94 3.76 2.29.57.94-3.76c3.9.74 6.84.44 8.07-3.09.99-2.83-.05-4.47-2.09-5.54 1.49-.34 2.61-1.33 2.91-3.54zM16.4 15.5c-.68 2.73-5.28 1.25-6.76.88l1.04-4.18c1.48.37 6.18 1.1 5.72 3.3zm.65-6.1c-.62 2.48-4.44 1.22-5.67.91l.94-3.78c1.23.31 5.15.9 4.73 2.87z"/>
            </svg>
            Gold ↔ ₿ Tracker
        </h1>

        <div class="btc-banner" id="btcBanner" style="display: none;">
            <h2>Bitcoin Live Feed <span class="live-dot"></span></h2>
            <div class="btc-price" id="bigBtcPrice">INITIALIZING...</div>
            <div class="btc-change" id="btcUpdateTime">WAITING FOR DATA STREAM</div>
        </div>

        <div class="card">
            <div class="grid-2">
                <div>
                    <label for="goldPrice">Gold Input (USD/oz)</label>
                    <input type="number" id="goldPrice" placeholder="ENTER VALUE" step="0.01">
                </div>
                <div style="display:flex; align-items:flex-end;margin-bottom: 20px;">
                    <button id="fetchBtn" onclick="fetchAndCalculate()">
                        >> EXECUTE FETCH
                    </button>
                </div>
            </div>
            <div id="statusMessage" class="status-msg"></div>
        </div>

        <div class="split-view" id="splitView" style="display: none;">
            <div class="card">
                <h3>Live Data Stream <span id="liveStatus" style="font-size:0.7em; color:var(--primary-mint); display:none;"><span class="live-indicator"></span>AUTO (5m)</span></h3>
                <div class="results">
                    <div class="result-item"><span class="label">Gold Price</span><span class="value" id="goldDisplay">$0.00</span></div>
                    <div class="result-item"><span class="label">BTC Price</span><span class="value" id="btcDisplay">$0.00</span></div>
                    <div class="result-item"><span class="label">1 oz Gold =</span><span class="value" id="goldToBtc">0.00000000 BTC</span></div>
                    <div class="result-item"><span class="label">Ratio (BTC:Gold)</span><span class="value" id="ratio">0.00</span></div>
                    <div class="result-item" style="border:none; font-size: 0.8rem; color: #666; margin-top: 10px;">
                        <span class="label">Timestamp</span>
                        <span id="timestamp">--:--:--</span>
                    </div>
                </div>
                <div class="controls">
                    <button class="secondary" onclick="addToHistory()">LOG DATA POINT</button>
                    <label class="toggle-label">
                        <input type="checkbox" id="autoUpdate" onchange="toggleAutoUpdate()"> 
                        ENABLE AUTO-STREAM
                    </label>
                </div>
            </div>

            <div class="card">
                <h3>Ratio History Graph</h3>
                <div class="chart-container">
                    <canvas id="ratioChart"></canvas>
                </div>
                <p style="font-size: 0.75rem; color: #666; margin-top: 0.5rem; text-align: center; font-family: 'JetBrains Mono';">
                    *DATA REFRESH INTERVAL: 300s
                </p>
            </div>
        </div>

        <div class="card" id="converterCard" style="display: none;">
            <h3>Unit Converter</h3>
            <div class="converter-grid">
                <div>
                    <label>Gold (oz)</label>
                    <input type="number" id="goldInput" placeholder="AMOUNT">
                    <button onclick="convertGoldToBtc()">GOLD → BTC</button>
                </div>
                <div>
                    <label>BTC</label>
                    <input type="number" id="btcInput" placeholder="AMOUNT">
                    <button onclick="convertBtcToGold()">BTC → GOLD</button>
                </div>
            </div>
            <div id="conversionResult" class="results" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <script>
        let currentPrices = { gold: 0, btc: 0, timestamp: null };
        let chartInstance = null;
        let autoUpdateInterval = null;
        let btcLiveInterval = null;

        function destroyChart() {
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
        }

        function initChart() {
            destroyChart();
            const canvas = document.getElementById('ratioChart');
            const ctx = canvas.getContext('2d');
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '1 BTC = X oz Gold',
                        data: [],
                        borderColor: '#00f5d4', // Mint Green
                        backgroundColor: 'rgba(0, 245, 212, 0.1)',
                        borderWidth: 2,
                        tension: 0.1, // Less curve, more tech
                        fill: true,
                        pointRadius: 3,
                        pointBackgroundColor: '#b589ff', // Lavender
                        pointBorderColor: '#00f5d4',
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false, // Critical for CPU & Tech feel
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: { 
                            labels: { 
                                color: '#b589ff', 
                                font: { family: "'JetBrains Mono', monospace", size: 11 } 
                            } 
                        },
                        tooltip: {
                            backgroundColor: 'rgba(13, 13, 18, 0.9)',
                            titleColor: '#00f5d4',
                            bodyColor: '#e0f7fa',
                            borderColor: 'rgba(0, 245, 212, 0.3)',
                            borderWidth: 1,
                            fontFamily: "'JetBrains Mono', monospace",
                            callbacks: {
                                label: function(context) {
                                    return `Ratio: ${context.parsed.y.toFixed(4)} oz`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            ticks: { 
                                color: '#666', 
                                font: { family: "'JetBrains Mono', monospace", size: 10 } 
                            }, 
                            grid: { color: 'rgba(0, 245, 212, 0.1)' } 
                        },
                        y: { 
                            ticks: { 
                                color: '#666', 
                                font: { family: "'JetBrains Mono', monospace", size: 10 } 
                            }, 
                            grid: { color: 'rgba(0, 245, 212, 0.1)' } 
                        }
                    }
                }
            });
        }

        async function fetchBtcPrice() {
            const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data.bitcoin.usd;
        }

        async function updateBigBtcBanner() {
            try {
                const btcPrice = await fetchBtcPrice();
                currentPrices.btc = btcPrice;
                currentPrices.timestamp = new Date();
                
                const banner = document.getElementById('btcBanner');
                const priceEl = document.getElementById('bigBtcPrice');
                const timeEl = document.getElementById('btcUpdateTime');
                
                if(banner) banner.style.display = 'block';
                if(priceEl) priceEl.textContent = `$${btcPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                if(timeEl) timeEl.textContent = `LAST SYNC: ${currentPrices.timestamp.toLocaleTimeString()}`;

                if (currentPrices.gold > 0) {
                    updateStats();
                }
            } catch (error) {
                console.error("Error updating BTC banner:", error);
            }
        }

        async function fetchAndCalculate() {
            const goldInput = document.getElementById('goldPrice');
            const statusMsg = document.getElementById('statusMessage');
            const fetchBtn = document.getElementById('fetchBtn');
            
            const goldPrice = parseFloat(goldInput.value);
            if (!goldPrice || goldPrice <= 0) {
                statusMsg.innerHTML = '<div class="error">ERROR: INVALID INPUT DETECTED</div>';
                return;
            }

            fetchBtn.disabled = true;
            statusMsg.innerHTML = '<div class="success">>> INITIATING DATA FETCH...</div>';

            try {
                const btcPrice = await fetchBtcPrice();
                currentPrices = { gold: goldPrice, btc: btcPrice, timestamp: new Date() };
                
                updateStats();
                updateBigBtcBanner();
                
                document.getElementById('splitView').style.display = 'grid';
                document.getElementById('converterCard').style.display = 'block';
                
                if (!chartInstance) {
                    initChart();
                }
                
                statusMsg.innerHTML = '<div class="success">>> DATA STREAM ESTABLISHED</div>';
            } catch (error) {
                statusMsg.innerHTML = `<div class="error">>> CONNECTION FAILED: ${error.message}</div>`;
            } finally {
                fetchBtn.disabled = false;
            }
        }

        function updateStats() {
            const { gold, btc, timestamp } = currentPrices;
            if (!btc || !gold) return;
            
            const ratio = btc / gold; 
            
            const el = (id) => document.getElementById(id);
            
            if(el('goldDisplay')) el('goldDisplay').textContent = `$${gold.toLocaleString(undefined, {minimumFractionDigits:2})}`;
            if(el('btcDisplay')) el('btcDisplay').textContent = `$${btc.toLocaleString(undefined, {minimumFractionDigits:2})}`;
            if(el('goldToBtc')) el('goldToBtc').textContent = `${(gold/btc).toFixed(8)} BTC`;
            if(el('ratio')) el('ratio').textContent = `${ratio.toFixed(4)} oz`;
            if(el('timestamp')) el('timestamp').textContent = timestamp.toLocaleTimeString();
        }

        function addToHistory() {
            if (!chartInstance || !currentPrices.btc || !currentPrices.gold) return;
            
            const timeLabel = currentPrices.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const ratio = currentPrices.btc / currentPrices.gold;

            chartInstance.data.labels.push(timeLabel);
            chartInstance.data.datasets[0].data.push(ratio);
            
            if (chartInstance.data.labels.length > 50) {
                chartInstance.data.labels.shift();
                chartInstance.data.datasets[0].data.shift();
            }
            
            chartInstance.update('none');
        }

        function toggleAutoUpdate() {
            const checkbox = document.getElementById('autoUpdate');
            const liveStatus = document.getElementById('liveStatus');
            
            if (autoUpdateInterval) {
                clearInterval(autoUpdateInterval);
                autoUpdateInterval = null;
            }
            
            if (checkbox.checked) {
                if(currentPrices.btc > 0 && currentPrices.gold > 0) addToHistory();

                // 5 Minute Interval
                autoUpdateInterval = setInterval(() => {
                    if(document.getElementById('goldPrice').value) {
                        fetchAndCalculate().then(() => addToHistory());
                    }
                }, 300000);
                
                liveStatus.style.display = 'inline';
            } else {
                liveStatus.style.display = 'none';
            }
        }

        function startBtcLiveTracker() {
            updateBigBtcBanner();
            if (btcLiveInterval) clearInterval(btcLiveInterval);
            // 1 Minute Interval for Banner only
            btcLiveInterval = setInterval(updateBigBtcBanner, 60000);
        }

        window.onload = function() {
            startBtcLiveTracker();
        };

        window.onbeforeunload = function() {
            destroyChart();
            if (autoUpdateInterval) clearInterval(autoUpdateInterval);
            if (btcLiveInterval) clearInterval(btcLiveInterval);
        };

        function convertGoldToBtc() {
            const amount = parseFloat(document.getElementById('goldInput').value);
            if (!amount || amount <= 0) return alert("INVALID INPUT");
            const btc = (amount * currentPrices.gold) / currentPrices.btc;
            document.getElementById('conversionResult').innerHTML = `
                <div class="result-item"><span class="label">${amount} oz Gold</span><span class="value">${btc.toFixed(8)} BTC</span></div>
                <div class="result-item"><span class="label">Value</span><span class="value">$${(amount * currentPrices.gold).toLocaleString()}</span></div>
            `;
        }

        function convertBtcToGold() {
            const amount = parseFloat(document.getElementById('btcInput').value);
            if (!amount || amount <= 0) return alert("INVALID INPUT");
            const gold = (amount * currentPrices.btc) / currentPrices.gold;
            document.getElementById('conversionResult').innerHTML = `
                <div class="result-item"><span class="label">${amount} BTC</span><span class="value">${gold.toFixed(4)} oz Gold</span></div>
                <div class="result-item"><span class="label">Value</span><span class="value">$${(amount * currentPrices.btc).toLocaleString()}</span></div>
            `;
        }
    </script>
</body>
</html>
